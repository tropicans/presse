proxy_cache_path /var/cache/nginx/form-shell levels=1:2 keys_zone=form_shell_cache:10m max_size=100m inactive=30m use_temp_path=off;
proxy_cache_path /var/cache/nginx/form-api levels=1:2 keys_zone=form_api_cache:10m max_size=100m inactive=30m use_temp_path=off;

upstream isian_benchmark_app {
    least_conn;
    server app-bench-1:3456 max_fails=3 fail_timeout=30s;
    server app-bench-2:3456 max_fails=3 fail_timeout=30s;
    server app-bench-3:3456 max_fails=3 fail_timeout=30s;
    server app-bench-4:3456 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

server {
    listen 3456;
    server_name _;

    location ~ ^/f/[^/]+$ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache form_shell_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_valid 200 30s;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://isian_benchmark_app;
    }

    location ~ ^/api/public/forms/[^/]+$ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache form_api_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_valid 200 30s;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://isian_benchmark_app;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://isian_benchmark_app;
    }
}
