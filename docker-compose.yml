x-runtime-image: &runtime-image
  image: isian-runtime:local

x-runtime-build: &runtime-build
  build:
    context: .
    dockerfile: Dockerfile

x-benchmark-app: &benchmark-app
  <<: *runtime-image
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL wajib diisi}
    NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL wajib diisi}
    NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET wajib diisi}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID wajib diisi}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET wajib diisi}
    ADMIN_EMAILS: ${ADMIN_EMAILS:?ADMIN_EMAILS wajib diisi}
    INTERNAL_WORKER_TOKEN: ${INTERNAL_WORKER_TOKEN:?INTERNAL_WORKER_TOKEN wajib diisi}
    DB_POOL_MAX: ${DB_POOL_MAX:-20}
    DB_POOL_MIN: ${DB_POOL_MIN:-4}
    DB_POOL_CONNECTION_TIMEOUT_MS: ${DB_POOL_CONNECTION_TIMEOUT_MS:-10000}
    DB_POOL_IDLE_TIMEOUT_MS: ${DB_POOL_IDLE_TIMEOUT_MS:-30000}
    SUBMISSION_JOB_DELAY_SECONDS: ${SUBMISSION_JOB_DELAY_SECONDS:-5}
    RATE_LIMIT_SINGLE_INSTANCE_OK: ${RATE_LIMIT_SINGLE_INSTANCE_OK:-false}
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:3456/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 30s

x-worker: &worker
  <<: *runtime-image
  restart: unless-stopped
  environment:
    <<: *app-env
    WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-25}
    WORKER_IDLE_MS: ${WORKER_IDLE_MS:-100}
    WORKER_ERROR_MS: ${WORKER_ERROR_MS:-1000}
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    container_name: isian-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=256MB
    ports:
      - "5443:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-isian_attendance}
      POSTGRES_USER: ${POSTGRES_USER:-isian_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-isian_user} -d $${POSTGRES_DB:-isian_attendance}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    <<: [*runtime-image, *runtime-build]
    container_name: isian-app
    restart: unless-stopped
    ports:
      - "3456:3456"
    environment:
      <<: *app-env
      DB_POOL_MAX: ${DB_POOL_MAX:-40}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3456/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *worker
    container_name: isian-worker
    command: ["node", "scripts/submission-worker.mjs"]
    environment:
      <<: *app-env
      WORKER_BASE_URL: http://app:3456
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-25}
      WORKER_IDLE_MS: ${WORKER_IDLE_MS:-100}
      WORKER_ERROR_MS: ${WORKER_ERROR_MS:-1000}
    depends_on:
      app:
        condition: service_healthy

  app-bench-1:
    <<: *benchmark-app
    profiles: ["bench"]

  app-bench-2:
    <<: *benchmark-app
    profiles: ["bench"]

  app-bench-3:
    <<: *benchmark-app
    profiles: ["bench"]

  app-bench-4:
    <<: *benchmark-app
    profiles: ["bench"]

  worker-bench-1:
    <<: *worker
    profiles: ["bench"]
    command: ["node", "scripts/submission-worker.mjs"]
    environment:
      <<: *app-env
      WORKER_BASE_URL: http://app-bench-1:3456
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-25}
      WORKER_IDLE_MS: 50
      WORKER_ERROR_MS: ${WORKER_ERROR_MS:-1000}
    depends_on:
      app-bench-1:
        condition: service_healthy

  worker-bench-2:
    <<: *worker
    profiles: ["bench"]
    command: ["node", "scripts/submission-worker.mjs"]
    environment:
      <<: *app-env
      WORKER_BASE_URL: http://app-bench-2:3456
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-25}
      WORKER_IDLE_MS: 50
      WORKER_ERROR_MS: ${WORKER_ERROR_MS:-1000}
    depends_on:
      app-bench-2:
        condition: service_healthy

  proxy-bench:
    image: nginx:1.27-alpine
    profiles: ["bench"]
    container_name: isian-proxy-bench
    restart: unless-stopped
    ports:
      - "3457:3456"
    volumes:
      - ./infra/nginx/benchmark.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-bench-1
      - app-bench-2
      - app-bench-3
      - app-bench-4

volumes:
  pgdata:
